name: CI - Test, Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  # Prefer an org set in repo/environment variables; fallback to Docker Hub username from secrets
  IMAGE_PREFIX: ${{ vars.DOCKERHUB_ORG || secrets.DOCKERHUB_USERNAME }}

jobs:
  version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate synchronized SemVer and release tag
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python backend/scripts/check_version.py
          --tag "${RELEASE_TAG}"
          --github-output "${GITHUB_OUTPUT}"

  secret-scan:
    name: Current Tree Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan checked-out files with Gitleaks
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: dir /github/workspace --redact --no-banner

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --run

      - name: Build production frontend
        run: npm run build

  test-backend-image:
    name: Backend Image Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag homelab-backup-backend-health-test ./backend

      - name: Verify plugin runtime tools
        shell: bash
        run: |
          set -euo pipefail
          image=homelab-backup-backend-health-test
          docker run --rm --entrypoint mysql "${image}" --version | grep '8.4.0'
          docker run --rm --entrypoint mysqldump \
            "${image}" --version | grep '8.4.0'
          docker run --rm --entrypoint mysqlsh "${image}" --version | grep '8.4.0'
          docker run --rm --entrypoint mysqlcheck \
            "${image}" --version
          docker run --rm --entrypoint pg_dump \
            "${image}" --version | grep 'PostgreSQL) 18.'
          docker run --rm --entrypoint pg_restore \
            "${image}" --version | grep 'PostgreSQL) 18.'
          docker run --rm --entrypoint git "${image}" --version
          docker run --rm --entrypoint wp \
            "${image}" cli version | grep 'WP-CLI 2.12.0'
          docker run --rm --entrypoint php "${image}" -r \
            'exit(extension_loaded("mysqli") ? 0 : 1);'

      - name: Verify declared health check
        shell: bash
        run: |
          set -euo pipefail
          container=homelab-backup-backend-health-test
          trap 'docker rm --force "${container}" >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name "${container}" \
            --health-interval 1s \
            --health-start-period 10s \
            --health-timeout 5s \
            --health-retries 5 \
            homelab-backup-backend-health-test

          for _ in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            case "${status}" in
              healthy)
                exit 0
                ;;
              unhealthy)
                docker inspect --format '{{json .State.Health}}' "${container}"
                docker logs "${container}"
                exit 1
                ;;
            esac
            sleep 1
          done

          docker inspect --format '{{json .State.Health}}' "${container}"
          docker logs "${container}"
          exit 1

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [version, secret-scan, test-backend, test-frontend, test-backend-image]
    if: github.event_name != 'pull_request'  # do not push images for PRs
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend image metadata and tags
      - name: Docker meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/homelab-backup
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=backend-sha-,format=short,enable={{is_default_branch}}
            type=raw,value=backend-latest,enable={{is_default_branch}}
            type=semver,pattern=backend-v{{version}}

      # Frontend image metadata and tags
      - name: Docker meta (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/homelab-backup
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=frontend-sha-,format=short,enable={{is_default_branch}}
            type=raw,value=frontend-latest,enable={{is_default_branch}}
            type=semver,pattern=frontend-v{{version}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
